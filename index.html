<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>card2me — Digital Business Cards</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #6c8cff;
    --accent-2: #b86cff;
    --accent-3: #ff6cc7;
    --accent-4: #ffd86c;
    --border: #262b36;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    --radius: 16px;
  }

  @keyframes float-blob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(20px, -20px) scale(1.08); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }
  @keyframes pop-in {
    0%   { opacity: 0; transform: translateY(10px) scale(.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(108,140,255,0.22), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(184,108,255,0.20), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(255,108,199,0.16), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    width: 320px; height: 320px;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .35;
    pointer-events: none;
    z-index: -1;
    animation: float-blob 12s ease-in-out infinite;
  }
  body::before {
    top: -80px; left: -80px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
  }
  body::after {
    bottom: -100px; right: -80px;
    background: radial-gradient(circle, var(--accent-3), transparent 70%);
    animation-delay: -6s;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  body.center-view {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.center-view .wrap {
    width: 100%;
    padding: 24px 20px;
  }

  .create-hero {
    text-align: center;
    margin: 0 0 22px;
    padding: 0 8px;
  }
  .create-hero h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.05;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 25%, var(--accent-3) 50%, var(--accent-4) 75%, var(--accent) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    animation: shine 30s linear infinite;
    filter: drop-shadow(0 6px 24px rgba(184,108,255,0.25));
  }
  .create-hero .hero-emoji {
    display: inline-block;
    font-size: 0.85em;
    margin-right: 8px;
    transform-origin: 70% 70%;
    animation: wiggle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
  }
  .create-hero .tagline {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  .create-hero .tagline b {
    color: var(--text);
    font-weight: 600;
  }


  .panel {
    position: relative;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
    animation: pop-in .35s ease-out;
  }
  .panel::before {
    content: "";
    position: absolute; inset: -1px;
    border-radius: calc(var(--radius) + 1px);
    padding: 1px;
    background: linear-gradient(135deg, rgba(108,140,255,0.5), rgba(255,108,199,0.4), rgba(255,216,108,0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
    opacity: .7;
  }

  h2 { margin: 0 0 4px; font-size: 20px; }
  .subtitle { color: var(--muted); margin: 0 0 16px; font-size: 13px; }

  form .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
  }
  form .full { grid-column: 1 / -1; }
  form .photo-cell { grid-row: span 2; display: flex; flex-direction: column; align-items: center; }
  form .photo-cell label { align-self: center; padding-left: 0px; }

  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding-left: 12px;
  }
  input[type=text], input[type=email], input[type=tel], input[type=url], textarea {
    width: 100%;
    background: #11141b;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  textarea { resize: vertical; min-height: 56px; }
  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,140,255,0.18);
  }
  input:hover:not(:focus), textarea:hover:not(:focus) {
    border-color: #3a4256;
  }

  /* Photo picker: the preview circle IS the button */
  .photo-picker {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100px;
    display: flex; align-items: center; justify-content: center;
    grid-row: span 2;
  }
  .photo-picker input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
    z-index: 2;
  }
  .photo-picker .preview {
    width: 100px; height: 100px; border-radius: 50%;
    background: #11141b;
    border: 1px dashed rgba(108,140,255,0.5);
    background-size: cover; background-position: center;
    position: relative;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo-picker .preview::after {
    content: "📷";
    font-size: 32px; opacity: .7;
    transition: transform .3s;
    margin-top: -14px
  }
  .photo-picker .preview.has-photo::after { content: ""; }
  .photo-picker:hover .preview {
    border-color: var(--accent);
    border-style: solid;
    box-shadow: 0 0 0 4px rgba(108,140,255,0.15);
  }

  .actions {
    margin-top: 18px;
    display: flex; gap: 10px; justify-content: flex-end;
  }
  button, .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: #11141b;
    color: var(--text);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s, background .15s, box-shadow .2s;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
  }
  button:hover, .btn:hover { border-color: #3a4256; transform: translateY(-1px); }
  button:active { transform: translateY(1px) scale(.98); }
  button.primary, .btn.primary {
    position: relative;
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    background-size: 200% 200%;
    border-color: transparent;
    color: white;
    box-shadow: 0 6px 20px rgba(108,140,255,0.35);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, background-position .4s;
  }
  button.primary:hover, .btn.primary:hover {
    background-position: 100% 50%;
    box-shadow: 0 10px 28px rgba(184,108,255,0.45);
    transform: translateY(-2px);
  }

  /* Card view — styled like a physical contact card */
  .card {
    padding: 0;
    overflow: hidden;
  }
  .card-header {
    position: relative;
    padding: 28px 28px 22px;
    display: flex;
    align-items: center;
    gap: 20px;
    background:
      radial-gradient(circle at 0% 0%, rgba(108,140,255,0.35), transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(255,108,199,0.30), transparent 60%),
      linear-gradient(135deg, rgba(108,140,255,0.18), rgba(184,108,255,0.12), rgba(255,108,199,0.18));
    border-bottom: 1px solid var(--border);
  }
  .card-header::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(108,140,255,0.6), rgba(255,108,199,0.6), transparent);
  }
  .card-corner {
    position: absolute;
    top: 14px; right: 18px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: .8;
  }
  .card .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 600; color: white;
    background-size: cover; background-position: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .card-identity { min-width: 0; flex: 1; }
  .card .name {
    font-size: 24px; font-weight: 700; margin: 0;
    letter-spacing: 0.2px;
    word-break: break-word;
  }
  .card .title { color: var(--text); opacity: .9; margin-top: 4px; font-size: 14px; font-weight: 500; }
  .card .company { color: var(--muted); margin-top: 2px; font-size: 13px; }

  .card-body { padding: 22px 28px 24px; }

  .info {
    margin-top: 0;
    display: grid;
    gap: 1px;
    text-align: left;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .info > a, .info > span {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #11141b;
    border: 0;
    border-radius: 0;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    word-break: break-word;
    transition: background .15s;
  }
  .info > a:hover { background: #161a23; }
  .info .icon {
    width: 28px; height: 28px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(108,140,255,0.2), rgba(255,108,199,0.2));
    font-size: 14px;
    flex-shrink: 0;
  }
  .info .field { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .info .label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 2px;
  }
  .info .value { word-break: break-word; }

  @media (max-width: 480px) {
    .card-header { flex-direction: column; text-align: center; gap: 14px; padding: 26px 20px 20px; }
    .card-body { padding: 18px 18px 20px; }
  }
  .note { color: var(--muted); margin-top: 4px; font-size: 13px; }

  .share {
    margin-top: 22px;
    display: flex; gap: 8px;
  }
  .share input {
    flex: 1;
    background: #11141b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #11141b; color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .card-footer-link {
    text-align: center; margin-top: 18px;
  }
  .card-footer-link a { color: var(--muted); font-size: 13px; text-decoration: none; }
  .card-footer-link a:hover { color: var(--text); }

  @media (max-width: 560px) {
    form .grid { grid-template-columns: 1fr; }
    .wrap { padding: 28px 14px 60px; }
  }
</style>
</head>
<body class="center-view">
<div class="wrap">
  <!-- CREATE VIEW -->
  <header id="create-hero" class="create-hero" hidden>
    <h1>card2me</h1>
    <p class="tagline">Create a digital contact card in seconds — just a shareable link, no sign-up, no server</p>
  </header>
  <section id="create-view" class="panel" hidden>
    <form id="card-form" autocomplete="off">
      <div class="grid">
        <div>
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" required />
        </div>
        <div class="photo-cell">
          <label for="photo">Photo</label>
          <div class="photo-picker" title="Click to choose a photo">
            <div id="photo-preview" class="preview"></div>
            <input id="photo" name="photo" type="file" accept="image/*" />
          </div>
        </div>

        <div>
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" type="text" />
        </div>

        <div>
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="e.g. Product Designer" />
        </div>
        <div>
          <label for="company">Company</label>
          <input id="company" name="company" type="text" />
        </div>

        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" placeholder="+34 987654321" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
        </div>

        <div class="full">
          <label for="website">Website</label>
          <input id="website" name="website" type="url" placeholder="https://example.com" />
        </div>

        <div class="full">
          <label for="address">Address</label>
          <input id="address" name="address" type="text" placeholder="Street, City, Country" />
        </div>

        <div class="full">
          <label for="note">Note</label>
          <textarea id="note" name="note" placeholder="Anything you'd like to add"></textarea>
        </div>
      </div>

      <div class="actions">
        <button type="reset">Clear</button>
        <button type="submit" class="primary">Create card →</button>
      </div>
    </form>
  </section>

  <!-- CARD VIEW -->
  <section id="card-view" class="panel card" hidden>
    <div class="card-header">
      <div id="avatar" class="avatar"></div>
      <div class="card-identity">
        <h2 id="fullName" class="name"></h2>
        <div id="jobTitle" class="title"></div>
        <div id="companyName" class="company"></div>
      </div>
    </div>

    <div class="card-body">
      <div class="info" id="info"></div>

      <div class="actions" style="justify-content: center; margin-top: 22px;">
        <button id="vcf-btn" class="primary">＋ Add to Contacts</button>
        <button id="share-btn">Copy link</button>
      </div>

      <div class="share">
        <input id="share-url" readonly />
      </div>

      <div class="card-footer-link">
        <a href="#" id="create-another">Create another card →</a>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>

<script>
/* ------------ utils ------------ */
function encodeData(obj) {
  const json = JSON.stringify(obj);
  // utf-8 safe base64
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeData(str) {
  let b64 = str.replace(/-/g,'+').replace(/_/g,'/');
  while (b64.length % 4) b64 += '=';
  const json = decodeURIComponent(escape(atob(b64)));
  return JSON.parse(json);
}

function escHtml(s) {
  return (s||'').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ------------ vCard ------------ */
function buildVCF(c) {
  const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
  const first = c.firstName || '';
  const last  = c.lastName  || '';
  lines.push(`N:${last};${first};;;`);
  lines.push(`FN:${[first,last].filter(Boolean).join(' ')}`);
  if (c.company) lines.push(`ORG:${c.company}`);
  if (c.title)   lines.push(`TITLE:${c.title}`);
  if (c.phone)   lines.push(`TEL;TYPE=CELL:${c.phone}`);
  if (c.email)   lines.push(`EMAIL;TYPE=INTERNET:${c.email}`);
  if (c.website) lines.push(`URL:${c.website}`);
  if (c.address) lines.push(`ADR;TYPE=WORK:;;${c.address};;;;`);
  if (c.note)    lines.push(`NOTE:${c.note.replace(/\n/g,'\\n')}`);
  if (c.photo && c.photo.startsWith('data:image')) {
    const m = c.photo.match(/^data:image\/(\w+);base64,(.+)$/);
    if (m) lines.push(`PHOTO;ENCODING=b;TYPE=${m[1].toUpperCase()}:${m[2]}`);
  }
  lines.push('END:VCARD');
  return lines.join('\r\n');
}

async function downloadVCF(c) {

  const vcf = buildVCF(c);
  // Using text/x-vcard for better Android compatibility
  const vcardBlob = new Blob([vcf], { type: "text/x-vcard;charset=utf-8" });
  const fileName = "contact.vcf";

  // MOBILE: Priority 1 - Web Share API
  if (navigator.share) {
    const file = new File([vcardBlob], fileName, { type: "text/x-vcard" });
    try {
      await navigator.share({
        files: [file],
        title: "Save Contact",
      });
      return;
    } catch (err) {
      // If user cancels or share fails, it falls through to download
    }
  }

  // FALLBACK: Standard Download
  const url = window.URL.createObjectURL(vcardBlob);
  const link = document.createElement("a");
  link.href = url;
  link.setAttribute("download", fileName);
  link.click();

  // Clean up
  setTimeout(() => window.URL.revokeObjectURL(url), 1000);
  /*
  const vcf = buildVCF(c);
  const blob = new Blob([vcf], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const name = [c.firstName, c.lastName].filter(Boolean).join("_") || "contact";

  a.href = url;
  a.download = `${name}.vcf`;
  a.style.display = "none";

  document.body.appendChild(a);
  console.log(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 2000);*/
}

/* ------------ views ------------ */
function show(id) {
  document.getElementById('create-view').hidden = id !== 'create';
  document.getElementById('card-view').hidden   = id !== 'card';
  const hero = document.getElementById('create-hero');
  if (hero) hero.hidden = id !== 'create';
}

function renderCard(c) {
  const fullName = [c.firstName, c.lastName].filter(Boolean).join(' ') || 'Unnamed';
  document.title = `${fullName} — card2me`;
  document.getElementById('fullName').textContent    = fullName;
  document.getElementById('jobTitle').textContent    = c.title   || '';
  document.getElementById('companyName').textContent = c.company || '';

  const avatar = document.getElementById('avatar');
  if (c.photo) {
    avatar.style.backgroundImage = `url(${c.photo})`;
    avatar.textContent = '';
  } else {
    avatar.style.backgroundImage = '';
    avatar.textContent = (c.firstName?.[0] || '') + (c.lastName?.[0] || '');
  }

  const info = document.getElementById('info');
  info.innerHTML = '';
  const row = (label, value, href, icon) => {
    if (!value) return;
    const el = href
      ? Object.assign(document.createElement('a'), { href })
      : document.createElement('span');
    el.innerHTML = `<span class="icon">${icon}</span><span class="field"><span class="label">${label}</span><span class="value">${escHtml(value)}</span></span>`;
    info.appendChild(el);
  };
  row('Phone',   c.phone,   c.phone   ? `tel:${c.phone}` : null, '📞');
  row('Email',   c.email,   c.email   ? `mailto:${c.email}` : null, '✉️');
  row('Website', c.website, c.website || null, '🌐');
  row('Address', c.address, null, '📍');
  row('Note',    c.note,    null, '📝');

  document.getElementById('share-url').value = location.href;

  document.getElementById('vcf-btn').onclick   = async () => downloadVCF(c);
  document.getElementById('share-btn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      toast('Link copied');
    } catch { toast('Copy failed'); }
  };
  document.getElementById('create-another').onclick = (e) => {
    e.preventDefault();
    location.href = location.pathname;
  };

  show('card');
}

/* ------------ create flow ------------ */
function initCreate() {
  const form = document.getElementById('card-form');
  const photoInput = document.getElementById('photo');
  const preview = document.getElementById('photo-preview');
  let photoDataUrl = '';

  photoInput.addEventListener('change', async () => {
    const f = photoInput.files?.[0];
    if (!f) {
      photoDataUrl = '';
      preview.style.backgroundImage = '';
      preview.classList.remove('has-photo');
      return;
    }
    photoDataUrl = await readFileAsDataURL(f);
    preview.style.backgroundImage = `url(${photoDataUrl})`;
    preview.classList.add('has-photo');
  });

  form.addEventListener('reset', () => {
    photoDataUrl = '';
    preview.style.backgroundImage = '';
    preview.classList.remove('has-photo');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    delete data.photo;
    if (photoDataUrl) data.photo = photoDataUrl;

    const payload = encodeData(data);
    const newUrl = `${location.pathname}?data=${payload}`;
    // redirect so creator gets the shareable link
    location.href = newUrl;
  });

  show('create');
}

/* ------------ boot ------------ */
(function boot() {
  const params = new URLSearchParams(location.search);
  let payload = params.get('data');
  // Backwards compatibility: also accept legacy #data=... links
  if (!payload) {
    const m = (location.hash || '').match(/(?:^|[#&])data=([^&]+)/);
    if (m) payload = m[1];
  }
  if (payload) {
    try {
      const data = decodeData(payload);
      renderCard(data);
      return;
    } catch (err) {
      console.error('Invalid card data', err);
    }
  }
  initCreate();
})();
</script>
</body>
</html>
